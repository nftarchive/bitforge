<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>BitForge#0652</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #000000; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; width: 352px; height: 352px;
           margin-left: -176px; margin-top: -176px; cursor: pointer;
           -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .tile { position: absolute; width: 6.25%; height: 6.25%;
          transition: transform .7s ease, opacity .7s ease; will-change: transform;
          background-repeat: no-repeat; }
</style>
</head>
<body>
  <div id="stage"></div>
  <script>
    // BitForge#0652 (Legendary #1) — final v23 pixel art, rendered as 16x16 PNG
    // tiles from the NFT image itself. Tap/click = scatter, rebuilds after 1.6s.
    // v23 PNG = 512px canvas, robot art 424px centered (44px margins).
    var IMG = 512, MARGIN = 44, ART = 424, NT = 16;
    var SLICE = ART / NT;                        // 26.5
    var BG_SIZE = IMG / SLICE * 100;             // 1932.08%
    var POS0 = MARGIN / (IMG - SLICE) * 100;     // 9.0628%
    var POSSTEP = SLICE / (IMG - SLICE) * 100;   // 5.4583%
    var URL = "https://nftarchive.github.io/bitforge/images/common_1791.png";
    var stage = document.getElementById("stage");
    for (var r = 0; r < 16; r++) {
      for (var c = 0; c < 16; c++) {
        var tile = document.createElement("div");
        tile.className = "tile";
        tile.style.left = (c * 6.25) + "%";
        tile.style.top = (r * 6.25) + "%";
        tile.style.backgroundImage = "url(" + URL + ")";
        tile.style.backgroundSize = BG_SIZE + "% " + BG_SIZE + "%";
        tile.style.backgroundPosition = (POS0 + c * POSSTEP) + "% " + (POS0 + r * POSSTEP) + "%";
        stage.appendChild(tile);
      }
    }
    var scattered = false;
    stage.addEventListener("click", function () {
      if (scattered) return;
      var tiles = stage.querySelectorAll(".tile");
      tiles.forEach(function (s) {
        s.style.transform = "translate(" + (Math.random() * 220 - 110) + "px," + (Math.random() * 220 - 110) + "px) rotate(" + (Math.random() * 360 - 180) + "deg)";
        s.style.opacity = "0.25";
      });
      scattered = true;
      setTimeout(function () {
        tiles.forEach(function (s) { s.style.transform = ""; s.style.opacity = ""; });
        scattered = false;
      }, 1600);
    });
  </script>
</body>
</html>
