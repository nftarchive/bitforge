/* ---------- face textures from each robot's own pixel grid ---------- */
function faceTexture(grid, dominant, r0, r1, c0, c1) {
  const w = c1 - c0 + 1, h = r1 - r0 + 1;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    ctx.fillStyle = grid[r][c] || dominant;
    ctx.fillRect(c - c0, r - r0, 1, 1);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
  tex.generateMipmaps = false; tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
/* A cell counts as a face feature (eye/mouth) when it is bright near-white.
   The gruff rule: eyes + mouth white = 190. */
function isWhite(hex) {
  if (!hex) return false;
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r >= 170 && g >= 170 && b >= 170 && Math.max(r, g, b) - Math.min(r, g, b) <= 12;
}
/* Head texture: ONLY the white face features stay, everything else becomes
   the robot's dominant color — so the face reads instantly at any distance. */
function headTexture(grid, dominant, r0, r1, c0, c1) {
  const w = c1 - c0 + 1, h = r1 - r0 + 1;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const cell = grid[r][c];
    ctx.fillStyle = isWhite(cell) ? '#ffffff' : dominant;
    ctx.fillRect(c - c0, r - r0, 1, 1);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
  tex.generateMipmaps = false; tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ---------- Roblox-style blocky humanoid ---------- */
const robot = new THREE.Group();
const body = new THREE.Group();
robot.add(body);
const plainMat = new THREE.MeshLambertMaterial({color: 0xffffff});
// face mats are BASIC (unlit) so the pixel face renders at full brightness, like the 2D art
const headFaceMat = new THREE.MeshBasicMaterial({});
const torsoFaceMat = new THREE.MeshBasicMaterial({});
function boxWithFace(w, h, d, fm) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, [plainMat, plainMat, plainMat, plainMat, fm, fm]);
  return mesh;
}
function limb(w, h, d, x, pivotY) {
  const g = new THREE.Group();
  g.position.set(x, pivotY, 0);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), plainMat);
  m.position.y = -h / 2;
  g.add(m);
  body.add(g);
  return g;
}

const legR = limb(0.8, 1.6, 0.8,  0.45, 1.6);

/* ---------- rarity aura ring + floating nameplate ---------- */
const auraRingMat = new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.65, side: THREE.DoubleSide});
const auraDiscMat = new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.18, side: THREE.DoubleSide});

const plateCanvas = document.createElement('canvas');
plateCanvas.width = 512; plateCanvas.height = 84;

function drawNameplate(R) {
  const ctx = plateCtx;
  ctx.clearRect(0, 0, 512, 84);
  ctx.fillStyle = 'rgba(10,18,30,0.72)';
  ctx.beginPath();
  ctx.roundRect(6, 10, 500, 64, 32);
  ctx.fill();
  const text = R.name + ' — ' + R.rarity;
  let size = 36;
  ctx.font = 'bold ' + size + 'px monospace';
  while (ctx.measureText(text).width > 460 && size > 20) {
    size -= 2;
    ctx.font = 'bold ' + size + 'px monospace';
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = R.color;
  ctx.fillText(text, 256, 44);
  plateTex.needsUpdate = true;
}

/* ---------- rarity switching ---------- */
let current = 'common';
function setRarity(key) {
  if (!ROBOTS[key]) return;
  const R = ROBOTS[key];
  current = key;
  plainMat.color.set(R.dominant);
  if (headFaceMat.map) headFaceMat.map.dispose();
  headFaceMat.map = headTexture(R.grid, R.dominant, 2, 7, 4, 11);
  headFaceMat.needsUpdate = true;
  if (torsoFaceMat.map) torsoFaceMat.map.dispose();
  torsoFaceMat.map = faceTexture(R.grid, R.dominant, 9, 15, 2, 13);
  torsoFaceMat.needsUpdate = true;
  auraRingMat.color.set(R.color);
  auraDiscMat.color.set(R.color);
  drawNameplate(R);
  document.querySelectorAll('#rarity button').forEach(b => {
    const on = b.dataset.r === key;
    b.classList.toggle('active', on);
    b.style.background = on ? ROBOTS[b.dataset.r].color : 'rgba(255,255,255,.75)';
  });
}
document.querySelectorAll('#rarity button').forEach(b =>
  b.addEventListener('click', () => setRarity(b.dataset.r)));

/* ---------- Vice City — bright PS2-style streets ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(20261117);
const lam = c => new THREE.MeshLambertMaterial({color: c});
// ground: warm sidewalk base
const ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), lam(0xd9cfb8));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
// streets: asphalt strips on a grid
const ROAD = 0x3d4450, DASH = 0xf5f0dc;
[-45, -15, 15, 45].forEach(v => {
  const rv = new THREE.Mesh(new THREE.PlaneGeometry(10, 240), lam(ROAD));
  rv.rotation.x = -Math.PI / 2; rv.position.set(v, 0.02, 0); scene.add(rv);
  const rh = new THREE.Mesh(new THREE.PlaneGeometry(240, 10), lam(ROAD));
  rh.rotation.x = -Math.PI / 2; rh.position.set(0, 0.02, v); scene.add(rh);
});
// dashed center lines
for (const v of [-45, -15, 15, 45]) {
  for (let p = -110; p <= 110; p += 8) {
    const d1 = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 3), lam(DASH));
    d1.rotation.x = -Math.PI / 2; d1.position.set(v, 0.04, p); scene.add(d1);
    const d2 = new THREE.Mesh(new THREE.PlaneGeometry(3, 0.5), lam(DASH));
    d2.rotation.x = -Math.PI / 2; d2.position.set(p, 0.04, v); scene.add(d2);
  }
}
// center plaza
const plaza = new THREE.Mesh(new THREE.CircleGeometry(11, 32), lam(0xe8e2d0));
plaza.rotation.x = -Math.PI / 2; plaza.position.y = 0.03; scene.add(plaza);
// pastel / neon buildings inside blocks
const palette = [0xff9ecb, 0x3fd9c0, 0xff7f6b, 0xffd94d, 0xb388ff, 0x7be0a3, 0xffb38a, 0x7cc4ff, 0xb8e356, 0xff5da2];
const NEON = [0xff4fd8, 0x00e5ff, 0xffe14d, 0x7dff5e];
const blocks = [];
for (const bx of [-60, -30, 0, 30, 60]) for (const bz of [-60, -30, 0, 30, 60]) {
  if (Math.abs(bx) < 13 && Math.abs(bz) < 13) continue;
  blocks.push([bx, bz]);
}
blocks.forEach(([bx, bz], i) => {
  const w = 7 + rnd() * 4, h = 6 + rnd() * 11, d = 7 + rnd() * 4;
  const col = palette[i % palette.length];
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), lam(col));
  b.position.set(bx + (rnd() - 0.5) * 3, h / 2, bz + (rnd() - 0.5) * 3);
  scene.add(b);
  // neon sign strip on the front face
  if (i % 3 === 0) {
    const nc = NEON[(i / 3 | 0) % NEON.length];
    const s = new THREE.Mesh(new THREE.BoxGeometry(w * 0.7, 0.7, 0.25),
      new THREE.MeshLambertMaterial({color: nc, emissive: nc, emissiveIntensity: 0.55}));
    s.position.set(b.position.x, Math.min(h - 1.2, 4.5), b.position.z + d / 2 + 0.15);
    scene.add(s);
  }
});
// palm trees along the sidewalks
function palm(x, z) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.24, 3.4, 6), lam(0x8a5a2b));
  trunk.position.y = 1.7; g.add(trunk);
  for (let k = 0; k < 6; k++) {
    const f = new THREE.Mesh(new THREE.ConeGeometry(0.85, 2.2, 4), lam(0x2fae5f));
    f.scale.set(1, 0.32, 1);
    const a = k / 6 * Math.PI * 2;
    f.position.set(Math.cos(a) * 0.9, 3.6, Math.sin(a) * 0.9);
    f.rotation.z = Math.cos(a) * 0.9; f.rotation.x = -Math.sin(a) * 0.9;
    g.add(f);
  }
  g.position.set(x, 0, z); scene.add(g);
}
[[-8, -38], [8, -38], [-8, 38], [8, 38], [-38, -8], [38, 8], [-38, 22], [38, -22], [-62, 8], [62, -8]].forEach(([x, z]) => palm(x, z));

}

/* ---------- pickups ---------- */
const pickups = [];
function spawnPickups() {
  for (let i = 0; i < 6; i++) {
    const a = rnd() * Math.PI * 2, r = 16 + rnd() * 30;
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9),
      new THREE.MeshLambertMaterial({color: 0xf5c518, emissive: 0xa67c00}));
    m.position.set(Math.cos(a) * r, 1.3, Math.sin(a) * r);
    m.userData.taken = false;
    scene.add(m); pickups.push(m);
  }
}
spawnPickups();
let collected = 0;
function updateCounter() { $('counter').innerHTML = '&#9670; ' + collected + ' / 6'; }

/* ---------- mission waypoints (walk/drive to each, in order) ---------- */
const WAYPOINTS = [[26, -22], [-32, 26], [12, 42]];
let missionIdx = 0;
const wpGroup = new THREE.Group(); scene.add(wpGroup);
const wpBeam = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 9, 20, 1, true),
  new THREE.MeshBasicMaterial({color: 0x00e5ff, transparent: true, opacity: 0.45, side: THREE.DoubleSide, depthWrite: false}));
wpBeam.position.y = 4.5; wpGroup.add(wpBeam);
const wpRing = new THREE.Mesh(new THREE.RingGeometry(1.8, 2.5, 32),
  new THREE.MeshBasicMaterial({color: 0x00e5ff, transparent: true, opacity: 0.9, side: THREE.DoubleSide}));
wpRing.rotation.x = -Math.PI / 2; wpRing.position.y = 0.06; wpGroup.add(wpRing);
function placeWaypoint() {
  const [x, z] = WAYPOINTS[missionIdx];
  wpGroup.position.set(x, 0, z);
  $('mission').textContent = '◉ MISI ' + (missionIdx + 1) + ' / 3';
}
placeWaypoint();

/* ---------- ONE drivable box car (hot pink) ---------- */
const car = new THREE.Group();
const carBodyM = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.8, 4.6), lam(0xff2e88));
carBodyM.position.y = 0.6; car.add(carBodyM);
const carCabM = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.7, 2.4), lam(0x223344));
carCabM.position.set(0, 1.3, -0.2); car.add(carCabM);
const carWheels = [];
[[-1.05, 1.55], [1.05, 1.55], [-1.05, -1.55], [1.05, -1.55]].forEach(([wx, wz]) => {
  const w = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.32, 12), lam(0x1a1a1a));
  w.rotation.z = Math.PI / 2; w.position.set(wx, 0.45, wz); car.add(w); carWheels.push(w);
});
car.position.set(7, 0, 9);
scene.add(car);
let driving = false, carHeading = 0, carSpeed = 0;
const HINT0 = 'WASD / panah = jalan | sentuh kiri = joystick, kanan = putar kamera | 1-4 = ganti rarity | E = naik mobil';
function nearCar() {
  const dx = car.position.x - robot.position.x, dz = car.position.z - robot.position.z;
  return dx * dx + dz * dz < 20;
}
function toggleCar() {
  if (driving) {
    driving = false;
    robot.visible = true;
    robot.position.set(car.position.x + 3, 0, car.position.z + 1);
    $('hint').textContent = HINT0;
  } else if (nearCar()) {
    driving = true;
    robot.visible = false;
    carSpeed = 0;
    $('hint').textContent = 'Mengemudi! WASD = gas/belok | E / tombol = turun';
  }
}
function driveCar(ix, iz, dt) {
  let fwd = 0, steer = 0;
  if (keys['w'] || keys['arrowup']) fwd += 1;
  if (keys['s'] || keys['arrowdown']) fwd -= 1;
  if (keys['a'] || keys['arrowleft']) steer += 1;
  if (keys['d'] || keys['arrowright']) steer -= 1;
  fwd += -joy.y; steer += -joy.x;
  carSpeed += fwd * 14 * dt;
  carSpeed *= Math.max(0, 1 - dt * 1.2);
  carSpeed = Math.max(-8, Math.min(18, carSpeed));
  carHeading += steer * 1.9 * dt * Math.min(1, Math.abs(carSpeed) / 6) * (carSpeed < 0 ? -1 : 1);
  car.position.x += Math.sin(carHeading) * carSpeed * dt;
  car.position.z += Math.cos(carHeading) * carSpeed * dt;
  car.position.x = Math.max(-75, Math.min(75, car.position.x));
  car.position.z = Math.max(-75, Math.min(75, car.position.z));
  car.rotation.y = carHeading;
  carWheels.forEach(w => { w.rotation.x += carSpeed * dt * 2; });
  robot.position.copy(car.position);
}
document.getElementById('carbtn').addEventListener('click', toggleCar);

/* ---------- controls: WASD + touch joystick + camera orbit ---------- */
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (['1','2','3','4'].includes(e.key)) setRarity(['common','rare','epic','legendary'][+e.key - 1]);
  if (e.key.toLowerCase() === 'e') toggleCar();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
let camYaw = 0.6, camPitch = 0.30;
const joy = {active: false, id: null, ox: 0, oy: 0, x: 0, y: 0};
const orbit = {active: false, id: null, lx: 0, ly: 0};
const cv = $('c');
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch' && e.clientX < window.innerWidth / 2 && !joy.active) {
    joy.active = true; joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.x = 0; joy.y = 0;
    const j = $('joy'); j.style.display = 'block';
    j.style.left = (joy.ox - 55) + 'px'; j.style.top = (joy.oy - 55) + 'px';
    $('knob').style.left = '31px'; $('knob').style.top = '31px';
  } else if (!orbit.active) {
    orbit.active = true; orbit.id = e.pointerId; orbit.lx = e.clientX; orbit.ly = e.clientY;
  }
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointers */ }
});
cv.addEventListener('pointermove', e => {
  if (joy.active && e.pointerId === joy.id) {
    let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy;
    const len = Math.hypot(dx, dy), max = 48;
    if (len > max) { dx *= max / len; dy *= max / len; }
    joy.x = dx / max; joy.y = dy / max;
    $('knob').style.left = (31 + dx) + 'px'; $('knob').style.top = (31 + dy) + 'px';
  } else if (orbit.active && e.pointerId === orbit.id) {
    camYaw -= (e.clientX - orbit.lx) * 0.006;
    camPitch = Math.max(0.08, Math.min(1.0, camPitch + (e.clientY - orbit.ly) * 0.004));
    orbit.lx = e.clientX; orbit.ly = e.clientY;
  }
});
function endPointer(e) {
  if (joy.active && e.pointerId === joy.id) { joy.active = false; joy.x = 0; joy.y = 0; $('joy').style.display = 'none'; }
  if (orbit.active && e.pointerId === orbit.id) orbit.active = false;
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- loop ---------- */
const SPEED = 9;
let walkPhase = 0, faceAngle = 0, firstFrame = true;
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  let ix = 0, iz = 0;
  if (keys['w'] || keys['arrowup']) iz -= 1;
  if (keys['s'] || keys['arrowdown']) iz += 1;
  if (keys['a'] || keys['arrowleft']) ix -= 1;
  if (keys['d'] || keys['arrowright']) ix += 1;
  ix += joy.x; iz += joy.y;
  const len = Math.hypot(ix, iz);
  const moving = len > 0.15;
  if (driving) driveCar(ix, iz, dt);
  if (moving && !driving) {
    const cl = Math.min(len, 1);
    const sin = Math.sin(camYaw), cos = Math.cos(camYaw);
    const mx = (ix * cos - iz * sin) * cl, mz = (ix * sin + iz * cos) * cl;
    robot.position.x += mx * SPEED * dt;
    robot.position.z += mz * SPEED * dt;
    robot.position.x = Math.max(-70, Math.min(70, robot.position.x));
    robot.position.z = Math.max(-70, Math.min(70, robot.position.z));
    faceAngle = Math.atan2(mx, mz);
    walkPhase += dt * SPEED * 1.5;
  }
  // face movement direction (smooth)
  let d = faceAngle - robot.rotation.y;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  robot.rotation.y += d * Math.min(1, dt * 10);
  // walk swing + bob
  const sw = moving ? Math.sin(walkPhase) * 0.55 : 0;
  legL.rotation.x = sw; legR.rotation.x = -sw;
  armL.rotation.x = -sw; armR.rotation.x = sw;
  body.position.y = moving ? Math.abs(Math.sin(walkPhase)) * 0.12 : 0;
  // camera follow (third person, closer so the robot fills the screen)
  const tp = driving ? car.position : robot.position;
  const tx = tp.x, ty = tp.y + 3.3, tz = tp.z;
  const dist = 9, cy = Math.cos(camYaw), sy = Math.sin(camYaw);
  const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
  const cx = tx - sy * cp * dist, cz = tz - cy * cp * dist, cy2 = ty + sp * dist;
  camera.position.x += (cx - camera.position.x) * Math.min(1, dt * 6);
  camera.position.y += (cy2 - camera.position.y) * Math.min(1, dt * 6);
  camera.position.z += (cz - camera.position.z) * Math.min(1, dt * 6);
  camera.lookAt(tx, ty, tz);
  // pickups: bob, spin, collect
  const t = clock.elapsedTime;
  for (const p of pickups) {
    if (p.userData.taken) continue;
    p.rotation.y = t * 1.5;
    p.position.y = 1.3 + Math.sin(t * 2 + p.position.x) * 0.25;
    const dx = p.position.x - robot.position.x, dz = p.position.z - robot.position.z;
    if (dx * dx + dz * dz < 2.9) {
      p.userData.taken = true; p.visible = false;
      collected++; updateCounter();
      if (collected >= 6) {
        $('toast').textContent = 'Semua terkumpul! Spawn lagi...';
        $('toast').style.display = 'block';
        setTimeout(() => {
          for (const q of pickups) { q.userData.taken = false; q.visible = true; }
          collected = 0; updateCounter();
          $('toast').style.display = 'none';
        }, 1800);
      }
    }
  }
  // mission waypoint: reach the glowing beam
  const wdx = wpGroup.position.x - robot.position.x, wdz = wpGroup.position.z - robot.position.z;
  if (wdx * wdx + wdz * wdz < 12) {
    missionIdx++;
    if (missionIdx >= WAYPOINTS.length) {
      $('toast').textContent = 'Semua misi selesai! 🎉';
      $('toast').style.display = 'block';
      setTimeout(() => { missionIdx = 0; placeWaypoint(); $('toast').style.display = 'none'; }, 2000);
    } else {
      $('toast').textContent = 'Misi ' + missionIdx + ' selesai!';
      $('toast').style.display = 'block';
      setTimeout(() => { $('toast').style.display = 'none'; }, 1200);
      placeWaypoint();
    }
  }
  // car button visibility
  const cb = $('carbtn');
  if (driving) { cb.style.display = 'block'; cb.textContent = '🚗 TURUN'; }
  else if (nearCar()) { cb.style.display = 'block'; cb.textContent = '🚗 NAIK'; }
  else cb.style.display = 'none';
  renderer.render(scene, camera);
  if (firstFrame) { firstFrame = false; console.log('BITFORGE_GAME_READY'); }
}
window.__game = {robot, pickups, car, setRarity, toggleCar, get collected() { return collected; }, get rarity() { return current; }, get driving() { return driving; }, get mission() { return missionIdx; }};
tick();
